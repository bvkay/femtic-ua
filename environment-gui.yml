# environment-gui.yml - conda env for the student GUI (src/femtic_gui) and for prep_vulcan.py, which it launches.
#   conda env create -f environment-gui.yml        (from the repository root; installs the repo with pip -e .)
#   conda activate femtic_gui
#   femtic-gui config/vulcan_mesh_v2_rot.yml       (or: python -m femtic_gui config/vulcan_mesh_v2_rot.yml)
#   python tests/gui/run_all.py                    (the GUI tests; plain scripts, no pytest)
# conda-forge only. The pins below were installed and run together on 2026-10-06 (Windows 11, Python 3.11.17,
# 'pip check' clean); change them only together and re-run tests/gui/run_all.py. VTK, pyvista and pyvistaqt serve
# only src/femtic_gui/viewer3d.py: without them the 3D buttons are disabled and everything else works.
#
# pip freeze of this env on 2026-10-06:
#   attrs==26.1.0, certifi==2026.7.22, charset-normalizer==3.5.2, colorama==0.4.6, contourpy==1.3.3, cycler==0.12.1,
#   cyclopts==5.1.1, docstring_parser==0.18.0, fonttools==4.66.1, idna==3.20, kiwisolver==1.5.1, loguru==0.7.3,
#   markdown-it-py==4.2.0, matplotlib==3.11.2, mdurl==0.1.2, numpy==2.4.6, packaging (conda), pandas==2.3.3,
#   pillow==12.3.0, platformdirs==4.12.3, pooch==1.9.0, Pygments==2.21.0, pyparsing==3.3.3, pyqtgraph==0.14.0,
#   PySide6==6.11.2, PySide6_Addons==6.11.2, PySide6_Essentials==6.11.2, python-dateutil==2.9.0.post0, pytz==2026.5,
#   pyvista==0.49.0, pyvista-validation==0.2.2, pyvistaqt==0.13.1, PyYAML==6.0.3, QtPy==2.4.3, requests==2.34.2,
#   rich==15.0.0, rich-rst==2.2.0, ruamel.yaml==0.19.1, scooby==0.12.0, shiboken6==6.11.2, six==1.17.0,
#   typing_extensions==4.16.0, tzdata==2026.5, urllib3==2.8.0, vtk==9.7.1, win32_setctime==1.2.0, -e .
#   (femtic-vulcan 0.1.0, this repository)
name: femtic_gui
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - PySide6==6.11.2            # with PySide6_Essentials, PySide6_Addons and shiboken6 6.11.2
      - pyqtgraph==0.14.0
      - ruamel.yaml==0.19.1        # round-trip parse of the config (comments survive; the GUI patches values in place)
      - loguru==0.7.3              # console strip sink
      - numpy==2.4.6
      - PyYAML==6.0.3              # prep_vulcan.py and femticPy
      - pandas==2.3.3              # femticPy needs pandas < 3 (scripts/prep_vulcan.py)
      - matplotlib==3.11.2         # femticPy imports it
      - pyvista==0.49.0            # 3D viewer only
      - pyvistaqt==0.13.1          # 3D viewer only
      - vtk==9.7.1                 # 3D viewer only
      - QtPy==2.4.3                # pyvistaqt's Qt shim; it picks the already imported PySide6
      - -e .
